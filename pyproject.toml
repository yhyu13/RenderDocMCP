[project]
name = "renderdoc-mcp"
version = "1.0.0"
description = "MCP server for RenderDoc graphics debugging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
renderdoc-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# rdc_harness is the verification/orchestration library consumed on the
# AI/MCP side; it must ship in the wheel alongside mcp_server.
packages = ["mcp_server", "rdc_harness"]

[tool.uv]
package = true
dev-dependencies = []

# Run tests (stdlib unittest, no pytest required):
#   python -m unittest discover -s tests
